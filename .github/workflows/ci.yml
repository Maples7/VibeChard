name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Smoke vch version
        run: ./.build/release/vch version

      - name: Smoke shim resolves real xcodebuild
        run: |
          # The shim should resolve the real xcodebuild via xcrun -f and
          # exec it. We pass -version (cheap, no project required); a
          # successful exec replaces the shim with xcodebuild itself.
          VCH_SHIM_DEBUG=1 ./.build/release/vch-xcodebuild-shim -version

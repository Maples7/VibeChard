name: Release

# Tag releases validate the CLI and both Homebrew bottles before publishing.
# HOMEBREW_TAP_TOKEN needs Contents: read/write on Maples7/homebrew-tap
# (or classic repo scope). GITHUB_TOKEN publishes this repository's assets.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Verify Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required; refusing to publish a release without updating maples7/homebrew-tap." >&2
            exit 1
          fi
          gh api --silent repos/Maples7/homebrew-tap

      - name: Verify tag matches source version
        run: |
          # Fail fast if someone pushes `v1.2.3` while
          # `VibeChard.version` still says `1.2.2`. Without this
          # guard the release ships, the tap gets bumped, and
          # `brew install` quietly serves a binary whose `vch
          # version` disagrees with the tag.
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oE 'public static let version = "[^"]+"' \
            Sources/VibeChardCore/Domain/VibeChard.swift \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag src=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VibeChard.version=$src" >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Smoke vch version
        run: ./.build/release/vch version

      - name: Smoke shim resolves real xcodebuild
        run: |
          # Same invariant as ci.yml: shim must exec the real
          # xcodebuild via `xcrun -f`. -version is a cheap probe.
          VCH_SHIM_DEBUG=1 ./.build/release/vch-xcodebuild-shim -version

      - name: Smoke tasks-less subcommands route correctly
        run: |
          # Closes the #82 / v0.5.0 regression at release time: every
          # reserved name must reach a real subcommand, not get
          # rewritten by the sugar dispatcher into a self-contradicting
          # exec call. We run a handful of subcommands that don't
          # require an Apple project on disk and just need to print
          # their --help and exit 0. The full forward+reverse check
          # runs in `swift test` above; this is the belt-and-suspenders
          # guard against a botched release artifact.
          for cmd in prune clean doctor sim land sync repair logs run \
                     build test exec open path list state remove; do
            ./.build/release/vch "$cmd" --help >/dev/null || {
              echo "::error::vch $cmd --help exited non-zero on the release artifact"
              exit 1
            }
          done

  bottles:
    needs: validate
    uses: ./.github/workflows/bottles.yml

  publish:
    name: Publish bottles & update tap
    needs: bottles
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-release
          path: dist

      - uses: actions/checkout@v5
        with:
          repository: Maples7/homebrew-tap
          ref: master
          path: .homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify tap write authentication before publishing
        run: git -C .homebrew-tap push --dry-run origin HEAD:refs/heads/master

      - name: Refuse to downgrade the tap
        run: |
          ruby - .homebrew-tap/vch.rb dist/vch.rb <<'RUBY'
          require "rubygems"
          versions = ARGV.map { |path| Gem::Version.new(File.read(path)[/^  version "([^"]+)"$/, 1]) }
          abort "Refusing to downgrade the Homebrew tap" if versions.first > versions.last
          RUBY

      - name: Publish verified assets before updating the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prerelease=false
          if [[ "$tag" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json"; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --prerelease="$prerelease" --generate-notes
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json"
          fi
          if ruby -rjson -e 'exit(JSON.parse(File.read(ARGV[0])).fetch("isDraft") ? 0 : 1)' "$RUNNER_TEMP/release.json"; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            # A retry must not replace public assets underneath existing checksums.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
            for asset in dist/*; do
              cmp "$asset" "$RUNNER_TEMP/published/$(basename "$asset")"
            done
          fi

      - name: Update Homebrew tap formula
        run: |
          set -euo pipefail
          cp dist/vch.rb .homebrew-tap/vch.rb
          cd .homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- vch.rb; then exit 0; fi
          git add vch.rb
          git commit -m "vch ${GITHUB_REF_NAME#v} with bottles"
          git push origin master

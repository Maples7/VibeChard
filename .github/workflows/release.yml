name: Release

# Triggered when a `v*` tag is pushed (e.g. `v0.1.0`, `v0.2.0-beta1`).
# Builds + tests release-mode binaries as a sanity check, creates the
# GitHub Release, then bumps `Formula/vch.rb` in `maples7/homebrew-tap`
# via mislav/bump-homebrew-formula-action so `brew install
# maples7/tap/vch` picks up the new version automatically.
#
# Required secret (set on the VibeChard repo, not the tap):
#   HOMEBREW_TAP_TOKEN  — a PAT with `repo` scope on the tap repo.
#                         The default GITHUB_TOKEN can't push to other
#                         repositories, so this PAT is mandatory.
#                         If unset, the tap-bump step is skipped and
#                         the rest of the release still completes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release & bump tap
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Hoist the secret to a job-level env var so per-step `if:`
      # expressions can compare against it (the `secrets` context is
      # not allowed inside `if:`).
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches source version
        run: |
          # Fail fast if someone pushes `v1.2.3` while
          # `VibeChard.version` still says `1.2.2`. Without this
          # guard the release ships, the tap gets bumped, and
          # `brew install` quietly serves a binary whose `vch
          # version` disagrees with the tag.
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oE 'public static let version = "[^"]+"' \
            Sources/VibeChardCore/Domain/VibeChard.swift \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag src=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VibeChard.version=$src" >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Smoke vch version
        run: ./.build/release/vch version

      - name: Smoke shim resolves real xcodebuild
        run: |
          # Same invariant as ci.yml: shim must exec the real
          # xcodebuild via `xcrun -f`. -version is a cheap probe.
          VCH_SHIM_DEBUG=1 ./.build/release/vch-xcodebuild-shim -version

      - name: Smoke tasks-less subcommands route correctly
        run: |
          # Closes the #82 / v0.5.0 regression at release time: every
          # reserved name must reach a real subcommand, not get
          # rewritten by the sugar dispatcher into a self-contradicting
          # exec call. We run a handful of subcommands that don't
          # require an Apple project on disk and just need to print
          # their --help and exit 0. The full forward+reverse check
          # runs in `swift test` above; this is the belt-and-suspenders
          # guard against a botched release artifact.
          for cmd in prune clean doctor sim land sync repair logs run \
                     build test exec open path list state remove; do
            ./.build/release/vch "$cmd" --help >/dev/null || {
              echo "::error::vch $cmd --help exited non-zero on the release artifact"
              exit 1
            }
          done

      - name: Create GitHub Release
        # v3 = first Node 24 major (April 2026); inputs unchanged from v2.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          # Anything like `v0.1.0-beta1` is treated as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Bump Homebrew formula in tap
        if: env.TAP_TOKEN != ''
        # v4 = first Node 24 major (March 2026); inputs unchanged from v3.
        uses: mislav/bump-homebrew-formula-action@v4
        env:
          # The action picks up COMMITTER_TOKEN from env to push the
          # formula edit to the tap repo on the user's behalf.
          COMMITTER_TOKEN: ${{ env.TAP_TOKEN }}
        with:
          formula-name: vch
          # The tap keeps the formula at the repo root, not under
          # Formula/. Both layouts are valid for a Homebrew tap.
          formula-path: vch.rb
          homebrew-tap: maples7/homebrew-tap
          # Tap's default branch is `master` (matches VibeChard).
          base-branch: master
          # Auto-generated source tarball URL — matches the
          # placeholder schema in tap's `vch.rb` so the action's
          # URL/version/sha256 rewrite Just Works. The action
          # downloads this URL itself to compute the sha256.
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
          commit-message: |
            {{formulaName}} {{version}}

            Auto-bumped from VibeChard ${{ github.ref_name }} via
            mislav/bump-homebrew-formula-action.

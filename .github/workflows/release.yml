name: Release

# Triggered when a `v*` tag is pushed (e.g. `v0.1.0`, `v0.2.0-beta1`).
# Builds + tests release-mode binaries as a sanity check, creates the
# GitHub Release, then syncs `Formula/vch.rb` into
# `maples7/homebrew-tap` with the release URL/checksum so
# `brew install maples7/tap/vch` picks up the new version automatically.
#
# Required secret (set on the VibeChard repo, not the tap):
#   HOMEBREW_TAP_TOKEN  — a PAT with `repo` scope on the tap repo.
#                         The default GITHUB_TOKEN can't push to other
#                         repositories, so this PAT is mandatory.
#                         If unset, the release fails before publishing
#                         artifacts so Homebrew can't silently lag behind.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release & bump tap
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Hoist the secret to a job-level env var so shell steps can verify it.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify Homebrew tap token
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required; refusing to publish a release without updating maples7/homebrew-tap." >&2
            exit 1
          fi

      - name: Verify tag matches source version
        run: |
          # Fail fast if someone pushes `v1.2.3` while
          # `VibeChard.version` still says `1.2.2`. Without this
          # guard the release ships, the tap gets bumped, and
          # `brew install` quietly serves a binary whose `vch
          # version` disagrees with the tag.
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oE 'public static let version = "[^"]+"' \
            Sources/VibeChardCore/Domain/VibeChard.swift \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag src=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VibeChard.version=$src" >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Smoke vch version
        run: ./.build/release/vch version

      - name: Smoke shim resolves real xcodebuild
        run: |
          # Same invariant as ci.yml: shim must exec the real
          # xcodebuild via `xcrun -f`. -version is a cheap probe.
          VCH_SHIM_DEBUG=1 ./.build/release/vch-xcodebuild-shim -version

      - name: Smoke tasks-less subcommands route correctly
        run: |
          # Closes the #82 / v0.5.0 regression at release time: every
          # reserved name must reach a real subcommand, not get
          # rewritten by the sugar dispatcher into a self-contradicting
          # exec call. We run a handful of subcommands that don't
          # require an Apple project on disk and just need to print
          # their --help and exit 0. The full forward+reverse check
          # runs in `swift test` above; this is the belt-and-suspenders
          # guard against a botched release artifact.
          for cmd in prune clean doctor sim land sync repair logs run \
                     build test exec open path list state remove; do
            ./.build/release/vch "$cmd" --help >/dev/null || {
              echo "::error::vch $cmd --help exited non-zero on the release artifact"
              exit 1
            }
          done

      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: maples7/homebrew-tap
          ref: master
          path: .homebrew-tap
          token: ${{ env.TAP_TOKEN }}

      - name: Bump Homebrew formula in tap
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          sha256="$(curl -fsSL "$download_url" | shasum -a 256 | awk '{print $1}')"

          cp Formula/vch.rb .homebrew-tap/vch.rb
          ruby - .homebrew-tap/vch.rb "$download_url" "$version" "$sha256" <<'RUBY'
          path, url, version, sha256 = ARGV
          text = File.read(path)
          text = text.sub(/^  url ".*"$/, %(  url "#{url}"))
          text = text.sub(/^  version ".*"$/, %(  version "#{version}"))
          text = text.sub(/^  sha256 ".*"$/, %(  sha256 "#{sha256}"))
          File.write(path, text)
          RUBY

          cd .homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- vch.rb; then
            echo "Tap formula already up to date."
            exit 0
          fi

          git add vch.rb
          git commit -m "vch ${version}" \
            -m "Auto-bumped from VibeChard ${tag}."
          git push origin master

      - name: Create GitHub Release
        # v3 = first Node 24 major (April 2026); inputs unchanged from v2.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          # Anything like `v0.1.0-beta1` is treated as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
